name: Repo Metrics

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          template: repository
          filename: github-metrics.svg
          
          # Keep base sections light
          base: header, activity, community, metadata
          
          # Plugins for this specific repo
          plugin_contributors: yes
          plugin_lines: yes
          
          # Keep languages enabled, but turn OFF indepth mode for speed
          plugin_languages: yes
          plugin_languages_indepth: false 
          plugin_languages_ignored: markdown, text